name: Collect Repository Metrics

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch: # Allow manual triggering

permissions: {}

concurrency:
  # Serialised, not cancelled: this job appends to CSVs and pushes, so an interrupted run
  # could commit a partial row.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # Needed to push the appended CSV rows to the metrics branch.

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: metrics
          # The token is supplied to the push step only, so it is not left in .git/config
          # for the intervening curl/jq steps to read.
          persist-credentials: false

      - name: Create metrics directory if it doesn't exist
        run: mkdir -p metrics

      # The traffic API requires push access, which the default GITHUB_TOKEN does not have
      # for this endpoint — hence the separate PAT. It is passed through env rather than
      # interpolated into the command so it never lands in a rendered command line.
      - name: Collect clone statistics
        env:
          METRICS_TOKEN: ${{ secrets.ACCESS_TOKEN_METRICS }}
        run: |
          set -uo pipefail

          DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Get clone statistics (last 14 days)
          CLONES_RESPONSE=$(curl -s -H "Authorization: Bearer ${METRICS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/clones")

          # Extract total clones and unique cloners
          TOTAL_CLONES=$(echo "$CLONES_RESPONSE" | jq -r '.count // 0')
          UNIQUE_CLONES=$(echo "$CLONES_RESPONSE" | jq -r '.uniques // 0')

          # Initialize CSV if it doesn't exist
          if [ ! -f metrics/clone-stats.csv ]; then
            echo "repository_name,date,clones,unique_cloners" > metrics/clone-stats.csv
          fi

          # Append new data
          echo "${GITHUB_REPOSITORY},${DATE},${TOTAL_CLONES},${UNIQUE_CLONES}" >> metrics/clone-stats.csv

          echo "Clone stats collected: Total=${TOTAL_CLONES}, Unique=${UNIQUE_CLONES}"

      - name: Collect view statistics
        env:
          METRICS_TOKEN: ${{ secrets.ACCESS_TOKEN_METRICS }}
        run: |
          set -uo pipefail

          DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Get view statistics (last 14 days)
          VIEWS_RESPONSE=$(curl -s -H "Authorization: Bearer ${METRICS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/views")

          # Extract total views and unique visitors
          TOTAL_VIEWS=$(echo "$VIEWS_RESPONSE" | jq -r '.count // 0')
          UNIQUE_VIEWS=$(echo "$VIEWS_RESPONSE" | jq -r '.uniques // 0')

          # Initialize CSV if it doesn't exist
          if [ ! -f metrics/traffic-stats.csv ]; then
            echo "repository_name,date,views,unique_visitors/cloners" > metrics/traffic-stats.csv
          fi

          # Append new data
          echo "${GITHUB_REPOSITORY},${DATE},${TOTAL_VIEWS},${UNIQUE_VIEWS}" >> metrics/traffic-stats.csv

          echo "View stats collected: Total=${TOTAL_VIEWS}, Unique=${UNIQUE_VIEWS}"

      - name: Collect referrer statistics
        env:
          METRICS_TOKEN: ${{ secrets.ACCESS_TOKEN_METRICS }}
        run: |
          set -uo pipefail

          DATE=$(date -u +"%Y-%m-%d %H:%M:%S")

          # Get referrer statistics
          REFERRERS_RESPONSE=$(curl -s -H "Authorization: Bearer ${METRICS_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/traffic/popular/referrers")

          # Initialize CSV if it doesn't exist
          if [ ! -f metrics/referrer-stats.csv ]; then
            echo "Date,Referrer,Count,Uniques" > metrics/referrer-stats.csv
          fi

          # Check if response is a valid array before processing
          RESPONSE_TYPE=$(echo "$REFERRERS_RESPONSE" | jq -r 'type')
          if [ "$RESPONSE_TYPE" = "array" ]; then
            REFERRER_COUNT=$(echo "$REFERRERS_RESPONSE" | jq '. | length')

            if [ "$REFERRER_COUNT" -eq 0 ]; then
              # No referrers found
              echo "${DATE},no-referrers,0,0" >> metrics/referrer-stats.csv
              echo "Referrer stats collected: 0 referrers found"
            else
              # Process each referrer and append to CSV
              echo "$REFERRERS_RESPONSE" | jq -r --arg date "$DATE" '.[] | "\($date),\(.referrer // "direct"),\(.count // 0),\(.uniques // 0)"' >> metrics/referrer-stats.csv
              echo "Referrer stats collected: ${REFERRER_COUNT} referrers found"
            fi
          else
            # API returned an error or unexpected response
            echo "${DATE},no-referrers,0,0" >> metrics/referrer-stats.csv
            echo "Referrer stats: API returned invalid response (type: ${RESPONSE_TYPE}), recorded as no referrers"
          fi

      # Replaces stefanzweifel/git-auto-commit-action, which was pinned only to a floating
      # major tag while holding contents: write. Plain git matches sync-plugins.yml and drops
      # a third-party dependency from the privileged path.
      - name: Commit metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          git add metrics

          if git diff --staged --quiet; then
            echo "No metrics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply metrics changes"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:metrics

      - name: Summary
        run: |
          echo "## Metrics Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "- Clone statistics updated" >> $GITHUB_STEP_SUMMARY
          echo "- View statistics updated" >> $GITHUB_STEP_SUMMARY
          echo "- Referrer statistics updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All metrics have been saved to the metrics/ folder and committed to the repository." >> $GITHUB_STEP_SUMMARY
