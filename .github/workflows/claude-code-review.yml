name: Claude Code Review

# Reviews PRs opened against this fork and posts findings as PR comments. The review skill stops
# if Claude has already commented, so there is no synchronize trigger: mention @claude in a
# comment to look at later pushes (see claude.yml).
#
# PRs from other forks are skipped because pull_request runs get no secrets there. Pinned to this
# fork for the same reason as claude.yml.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.repository == 'jmrada14/ai' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # read the code under review
      pull-requests: read # read the PR; comments are posted with the App token
      issues: read # read the PR conversation
      id-token: write # exchange the OIDC token for a Claude GitHub App token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
